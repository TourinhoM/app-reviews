apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - https://github.com/TourinhoM/platform-app-base//base?ref=v1.1.0

resources:
  - claims/appnamespace.yaml
  - claims/appdatabase.yaml
  - claims/appcache.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: app-config
    literals:
      - name=app-reviews
      - hostname=app-reviews.local

images:
  - name: app-image
    newName: ghcr.io/tourinhoM/app-reviews
    newTag: latest
